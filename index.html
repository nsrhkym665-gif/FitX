<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORTEX - منصة الألعاب العالمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #0b0e14;
    --card-bg: #151a24;
    --accent-color: #6366f1;
    --accent-hover: #4f46e5;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border-color: #232a3b;
  }

  * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
  
  header {
    background: #111622;
    border-bottom: 1px solid var(--border-color);
    padding: 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { margin: 0; font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 2px; }
  header h1 span { color: var(--accent-color); }
  header p { margin: 5px 0 0; font-size: 13px; color: var(--text-muted); }

  .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s, border-color 0.2s;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: var(--accent-color);
  }

  .card-header {
    padding: 15px;
    background: #1c2333;
    border-bottom: 1px solid var(--border-color);
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    color: #fff;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-body {
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .badge {
    align-self: flex-start;
    background: rgba(99, 102, 241, 0.2);
    color: var(--accent-color);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
  }

  .info { font-size: 12px; color: var(--text-muted); }

  .download-btn {
    display: block;
    margin: 15px;
    padding: 12px;
    background: var(--accent-color);
    color: #fff;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.2s;
  }
  .download-btn:hover { background: var(--accent-hover); }

  .loading { text-align: center; font-size: 18px; color: var(--accent-color); margin-top: 50px; font-weight: bold; }
</style>
</head>
<body>

  <header>
    <h1>VORTEX <span>GAMES</span></h1>
    <p>منصتك الشاملة لتحميل أحدث ألعاب PC مجاناً بروابط مباشرة وتورنت</p>
  </header>

  <div class="container">
    <div id="loading" class="loading">جاري اتصال المحرك وجلب أحدث الألعاب... 🎮</div>
    <div class="grid" id="gamesGrid"></div>
  </div>

  <script>
    async function fetchGames() {
      const grid = document.getElementById('gamesGrid');
      const loading = document.getElementById('loading');

      try {
        // جلب أحدث ألعاب التورنت المباشرة من محرك عام مفلتر
        const res = await fetch('https://torrentio.strem.fun/stream/series/tt0000000.json').catch(() => null);
        
        // استخدام مصدر احتياطي عام ومستقل
        const fallbackRes = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2F1337x.to%2Fcat%2FGames%2F1%2Frss.xml');
        const data = await fallbackRes.json();

        loading.style.display = 'none';

        data.items.forEach(item => {
          const title = item.title;
          
          // استخراج Magnet link أو رابط التحميل
          let magnet = item.link;
          if (item.content && item.content.includes('magnet:?')) {
            const match = item.content.match(/magnet:\?[^"]+/);
            if (match) magnet = match[0];
          }

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="card-header">
                <span class="badge">PC Game</span>
                <h3 class="card-title" style="margin-top:8px">${title}</h3>
              </div>
              <div class="card-body">
                <div class="info">تاريخ الإضافة: ${new Date(item.pubDate).toLocaleDateString('ar-EG')}</div>
                <div class="info">الحالة: جاهز للتحميل المباشر والتورنت</div>
              </div>
            </div>
            <a href="${magnet}" class="download-btn">تحميل اللعبة (Magnet/Torrent) ⚡</a>
          `;
          grid.appendChild(card);
        });

      } catch (e) {
        loading.textContent = 'تعذر جلب الألعاب، جرب تحديث الصفحة.';
      }
    }

    fetchGames();
  </script>
</body>
</html>
