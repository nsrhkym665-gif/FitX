<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitX Repacks - مكتبة الألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #0b0e14;
    --card-bg: #151a24;
    --accent-color: #6366f1;
    --accent-hover: #4f46e5;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border-color: #232a3b;
  }

  * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
  
  header {
    background: #111622;
    border-bottom: 1px solid var(--border-color);
    padding: 15px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { margin: 0; font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 1px; }
  header h1 span { color: var(--accent-color); }
  header p { margin: 5px 0 0; font-size: 13px; color: var(--text-muted); }

  .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    border-color: var(--accent-color);
  }

  .card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background-color: #000;
  }

  .card-content {
    padding: 15px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    justify-content: space-between;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 10px 0;
    line-height: 1.4;
    color: #fff;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 15px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .download-btn {
    display: block;
    width: 100%;
    padding: 10px;
    background: var(--accent-color);
    color: #fff;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
    transition: background 0.2s;
  }
  .download-btn:hover { background: var(--accent-hover); }

  .loading { text-align: center; font-size: 18px; color: var(--accent-color); margin-top: 50px; font-weight: bold; }
</style>
</head>
<body>

  <header>
    <h1>Fit<span>X</span> Repacks</h1>
    <p>أحدث الألعاب المضغوطة وروابط التحميل المباشرة والتورنت</p>
  </header>

  <div class="container">
    <div id="loading" class="loading">جاري جلب الألعاب وبوسترات التحميل... 🎮</div>
    <div class="grid" id="gamesGrid"></div>
  </div>

  <script>
    async function loadGames() {
      const grid = document.getElementById('gamesGrid');
      const loading = document.getElementById('loading');

      try {
        const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffitgirl-repacks.site%2Ffeed%2F');
        const data = await res.json();
        
        if(data.status !== 'ok') throw new Error();

        loading.style.display = 'none';

        data.items.forEach(item => {
          // استبعاد المقالات التي ليست ألعاباً
          if(item.title.includes('Upcoming Repacks') || item.title.includes('Updates Digest')) return;

          const parser = new DOMParser();
          const doc = parser.parseFromString(item.content || item.description, 'text/html');

          // 1. استخراج صورة اللعبة
          const imgTag = doc.querySelector('img');
          const imgSrc = imgTag ? imgTag.src : 'https://via.placeholder.com/300x180/151a24/ffffff?text=No+Image';

          // 2. استخراج رابط التورنت أو رابط التحميل المباشر بدلاً من رابط المقالة
          let downloadUrl = item.link; // الافتراضي
          
          // البحث عن روابط Magnet أو ملف التورنت المباشر داخل المقالة
          const magnetLink = doc.querySelector('a[href^="magnet:"]');
          const torrentFile = doc.querySelector('a[href*=".torrent"]');
          const directLinks = doc.querySelectorAll('a');

          if (magnetLink) {
            downloadUrl = magnetLink.href;
          } else if (torrentFile) {
            downloadUrl = torrentFile.href;
          } else {
            // البحث عن أول رابط تحميل خارجي مذكور في المقالة
            for (let a of directLinks) {
              if (a.href.includes('1337x') || a.href.includes('ruktor') || a.href.includes('katcr') || a.href.includes('pastebin')) {
                downloadUrl = a.href;
                break;
              }
            }
          }

          // 3. تنظيف الوصف
          const cleanDesc = doc.body.textContent.replace(/\s+/g, ' ').trim();

          // إنشاء الكارت
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img class="card-img" src="${imgSrc}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x180/151a24/ffffff?text=Game+Cover'">
            <div class="card-content">
              <div>
                <h3 class="card-title">${item.title}</h3>
                <p class="card-desc">${cleanDesc.substring(0, 100)}...</p>
              </div>
              <a href="${downloadUrl}" target="_blank" class="download-btn">تحميل اللعبة فوراً ⚡</a>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (e) {
        loading.textContent = 'حدث خطأ في تحميل الألعاب، يرجى تحديث الصفحة.';
      }
    }

    loadGames();
  </script>
</body>
</html>
