<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORTEX GAMES - مكتبة الألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --card: #151a24;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #232a3b;
  }

  * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
  
  header {
    background: #111622;
    border-bottom: 1px solid var(--border);
    padding: 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { margin: 0; font-size: 26px; font-weight: 900; color: #fff; }
  header h1 span { color: var(--accent); }
  header p { margin: 5px 0 0; font-size: 13px; color: var(--muted); }

  .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); }

  .card-img { width: 100%; height: 160px; object-fit: cover; background: #000; }

  .card-body { padding: 15px; }
  .card-title { font-size: 15px; font-weight: 700; margin: 0 0 10px 0; color: #fff; line-height: 1.4; }
  .card-desc { font-size: 12px; color: var(--muted); margin-bottom: 15px; line-height: 1.4; }

  .download-btn {
    display: block;
    margin: 0 15px 15px 15px;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
  }
  .download-btn:hover { background: var(--accent-hover); }

  .loading { text-align: center; font-size: 16px; color: var(--accent); margin-top: 40px; }
</style>
</head>
<body>

  <header>
    <h1>VORTEX <span>GAMES</span></h1>
    <p>منصة الألعاب المباشرة والتورنت</p>
  </header>

  <div class="container">
    <div id="loading" class="loading">جاري جلب الألعاب... 🎮</div>
    <div class="grid" id="gamesGrid"></div>
  </div>

  <script>
    async function loadGames() {
      const grid = document.getElementById('gamesGrid');
      const loading = document.getElementById('loading');

      try {
        // استخدام بروكسي موثوق 100% لمنع حظر المتصفح
        const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://fitgirl-repacks.site/feed/'));
        const result = await response.json();
        
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(result.contents, "text/xml");
        const items = xmlDoc.querySelectorAll("item");

        loading.style.display = 'none';

        items.forEach(item => {
          const title = item.querySelector("title")?.textContent || "";
          
          // فلترة المقالات الترويجية
          if (title.includes('Upcoming Repacks') || title.includes('Digest')) return;

          const content = item.querySelector("encoded")?.textContent || item.querySelector("description")?.textContent || "";
          const doc = parser.parseFromString(content, 'text/html');

          // 1. استخراج صورة اللعبة
          const img = doc.querySelector('img');
          const imgSrc = img ? img.src : 'https://via.placeholder.com/300x160/151a24/ffffff?text=VORTEX+GAMES';

          // 2. استخراج رابط Magnet للتورنت المباشر
          const magnet = doc.querySelector('a[href^="magnet:"]');
          const torrentLink = magnet ? magnet.href : item.querySelector("link")?.textContent;

          // 3. إنشاء كارت اللعبة
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <img class="card-img" src="${imgSrc}" alt="cover" onerror="this.src='https://via.placeholder.com/300x160/151a24/ffffff?text=VORTEX+GAMES'">
              <div class="card-body">
                <h3 class="card-title">${title}</h3>
                <p class="card-desc">نسخة كاملة جاهزة للتحميل المباشر والتورنت.</p>
              </div>
            </div>
            <a href="${torrentLink}" class="download-btn">تحميل اللعبة فوراً ⚡</a>
          `;
          grid.appendChild(card);
        });

      } catch (e) {
        loading.textContent = 'حدث خطأ في الاتصال، يرجى إعادة تحديث الصفحة.';
      }
    }

    loadGames();
  </script>
</body>
</html>
